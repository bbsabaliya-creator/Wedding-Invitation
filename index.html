<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Invitation — Our Journey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Great+Vibes&family=Montserrat:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="phone-frame" aria-label="Interactive Wedding Invitation">
    <div class="notch"></div>

    <!-- Top Controls: Music & 3-Line Journey Drawer -->
    <div class="top-controls">
      <button type="button" class="icon-btn" id="musicToggle" aria-label="Toggle music" title="Play / Mute Music">
        ♪
      </button>
      <button type="button" class="icon-btn" id="menuToggle" aria-label="Open Our Journey menu" title="Our Journey">
        ☰
      </button>
    </div>

    <!-- Curved Dashed Trail + Red Heart Across Scenes -->
    <div class="trail-layer" aria-hidden="true">
      <svg class="trail-svg" viewBox="0 0 370 740" preserveAspectRatio="none">
        <path
          id="trailPath"
          d="M 245 125 C 310 180, 75 240, 145 320 C 230 410, 295 450, 185 535 C 95 605, 155 665, 225 700"
          fill="none"
          stroke="#b83b4a"
          stroke-width="1.6"
          stroke-dasharray="4 4"
        />
      </svg>
      <div class="roaming-heart" id="roamingHeart">♥</div>
    </div>

    <!-- Main Chapter Stage -->
    <section class="stage" id="stage" aria-live="polite"></section>

    <!-- "Our Journey" Drawer (Hidden by default; opens on ☰ click) -->
    <aside class="drawer-overlay" id="drawerOverlay" aria-label="Our Journey Chapters">
      <div class="drawer-card">
        <button type="button" class="drawer-close" id="drawerClose" aria-label="Close menu">✕</button>
        <div class="drawer-header">
          <span>THE INVITATION</span>
          <h2>Our Journey</h2>
        </div>
        <ul class="drawer-list" id="drawerList"></ul>
      </div>
    </aside>

    <!-- Bottom Navigation Bar (BACK + CONTINUE / REPLAY) -->
    <footer class="nav-bar">
      <button type="button" class="back-btn" id="backBtn">← BACK</button>
      <button type="button" class="continue-btn" id="continueBtn">CONTINUE →</button>
    </footer>
  </main>

  <audio id="bgMusic" src="music/theme.mp3" loop preload="metadata"></audio>
  <script src="app.js"></script>
</body>
</html>
