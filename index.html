<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Invitation — Our Journey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Montserrat:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="phone-frame" aria-label="Interactive Wedding Invitation">
    <div class="notch"></div>

    <!-- Top Controls: Music & 3-Line Menu Toggle -->
    <div class="top-controls">
      <button type="button" class="icon-btn" id="musicToggle" aria-label="Toggle music" title="Play / Mute Music">
        ♪
      </button>
      <button type="button" class="icon-btn" id="menuToggle" aria-label="Open chapters menu" title="Chapters Menu">
        ☰
      </button>
    </div>

    <!-- Moving Heart Progress Track across all 11 pages -->
    <div class="heart-progress-wrap" aria-hidden="true">
      <div class="heart-track">
        <div class="heart-fill" id="heartFill"></div>
        <div class="moving-heart" id="movingHeart">♥</div>
      </div>
      <div class="page-counter" id="pageCounter">01 / 11</div>
    </div>

    <!-- Active Slide View -->
    <section class="slide-container" id="slideContent" aria-live="polite"></section>

    <!-- Chapter Drawer ("Our Journey" — Hidden until 3-line menu is clicked) -->
    <aside class="journey-overlay" id="journeyOverlay" aria-label="Chapters Navigation">
      <div class="journey-card">
        <div class="journey-header">
          <span>THE INVITATION</span>
          <h2>Our Journey</h2>
        </div>
        <ul class="chapter-list" id="chapterList"></ul>
      </div>
    </aside>

    <!-- Bottom Continue Pill Button -->
    <button type="button" class="continue-btn" id="continueBtn">CONTINUE →</button>
  </main>

  <audio id="bgMusic" src="music/theme.mp3" loop preload="metadata"></audio>
  <script src="app.js"></script>
</body>
</html>
